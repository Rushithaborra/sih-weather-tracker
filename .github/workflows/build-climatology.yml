name: Build live climatology

# One-off (run manually from the Actions tab): builds the year-round ERA5
# climatology stats the live GEFS run needs and commits
# data/clim/era5_monthly_stats.nc. Reads ~20 GB from WeatherBench2.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "ERA5 years"
        default: "2010-2019"
      day_step:
        description: "Sample every Nth day"
        default: "3"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-live.txt

      - run: pip install -r requirements-live.txt

      - run: python scripts/build_live_climatology.py --years ${{ inputs.years }} --day-step ${{ inputs.day_step }}

      - name: Commit climatology
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/clim/era5_monthly_stats.nc
          git commit -m "Build live climatology (ERA5 ${{ inputs.years }}, every ${{ inputs.day_step }} days)"
          git pull --rebase origin main
          git push origin HEAD:main
