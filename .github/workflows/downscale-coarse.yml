name: Downscaler coarse inputs

# Coarse ERA5 daily rainfall (1.5 deg, summed over IMD days) for the Stage 2 downscaler experiment,
# computed on GitHub's network and published as a build artifact (not committed).
on:
  push:
    branches: [next-features]
    paths: [.github/workflows/downscale-coarse.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-live.txt
      - run: pip install -r requirements-live.txt
      - run: python scripts/downscale_data.py --coarse-only 2010 2011 2012 2013 2014 2015 2016 2017 2018 2019 2020 2021
      - uses: actions/upload-artifact@v4
        with:
          name: downscale-coarse
          path: data/raw/downscale/coarse_*.nc
          retention-days: 30
