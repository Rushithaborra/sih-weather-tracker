name: Stage 2 downscaler experiment

# End to end on GitHub's network and CPUs (design fixed in DEV_LOG.md before training):
# IMD gauge rainfall 2010-2021 + coarse ERA5 inputs -> train U-Net and conditional diffusion
# -> evaluate on 2020-2021 and the held-out storm windows. Commits only results, maps and the
# small model weights; no raw data.
on:
  push:
    branches: [next-features]
    paths: [.github/workflows/downscaler.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downscaler
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-live.txt

      - name: Install
        run: |
          pip install -r requirements-live.txt matplotlib cartopy requests
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: IMD gauge rainfall 2010-2021
        run: python scripts/fetch_imd_rain.py 2010 2011 2012 2013 2014 2015 2016 2017 2018 2019 2020 2021

      - name: Build dataset (coarse ERA5 inputs + IMD targets)
        run: python scripts/downscale_data.py

      - name: Train and evaluate
        run: python scripts/downscale_train.py

      - name: Commit results
        run: |
          git config user.name "Rushitha Borra"
          git config user.email "rushithaborra@gmail.com"
          git add models/ data/processed/downscaler.json data/processed/downscaler_maps dashboard-ui/src/data/downscaler.js
          git commit -m "Stage 2 downscaler: results, storm maps and model weights"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
