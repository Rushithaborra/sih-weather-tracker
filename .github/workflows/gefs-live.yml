name: Live GEFS forecast

# Runs the detector and tracker on the latest NOAA GEFS ensemble every day and
# commits dashboard-ui/public/live/gefs_*.json, which the dashboard's Live
# forecast page reads. The 00 UTC run is fully published by ~05:30 UTC.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_run:  # first run right after the climatology is built
    workflows: ["Build live climatology"]
    types: [completed]
  workflow_dispatch:
    inputs:
      init:
        description: "Init time, e.g. 2026-09-30T00:00 (blank = latest)"
        required: false

permissions:
  contents: write

concurrency:
  group: gefs-live
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-live.txt

      - run: pip install -r requirements-live.txt

      - name: Fetch GEFS and run detection + tracking
        run: python scripts/run_gefs_live.py --workers 16 ${{ inputs.init && format('--init {0}', inputs.init) || '' }}

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-ui/public/live/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Live GEFS forecast: $(python -c "import json;print(json.load(open('dashboard-ui/public/live/gefs_latest.json'))['init'])")"
          git pull --rebase origin main
          git push origin HEAD:main
